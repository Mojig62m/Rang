<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فروشگاه بامرو | پیش‌نمایش UI</title>
<style>
@font-face{font-family:Vazirmatn;src:url('../wp-content/themes/bamero/assets/fonts/Vazirmatn-wght.woff2') format('woff2');font-weight:300 800;font-display:swap}
:root{--navy:#20252d;--ink:#1e252b;--muted:#727a81;--red:#d71920;--red-dark:#a90e15;--blue:#1f567d;--cream:#f8f7f4;--line:#e4e2dd;--green:#18835b;--gold:#d7ad49;--container:1320px}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#fff;color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;font-size:14px}.topbar{height:34px;background:#262b31;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 max(22px,calc((100% - var(--container))/2));font-size:11px}.topbar span{opacity:.9}.topbar .social{display:flex;gap:12px;direction:ltr}.site-header{background:#fff;border-bottom:1px solid #eee}.head-main{height:80px;max-width:var(--container);margin:auto;display:flex;align-items:center;gap:28px;padding:0 22px}.brand{display:flex;align-items:center;gap:10px;min-width:210px;color:var(--navy);text-decoration:none;font-size:24px;font-weight:800}.brand img{width:42px;height:42px;object-fit:contain}.brand-mark{width:42px;height:42px;border-radius:9px;background:linear-gradient(135deg,#2279ae,#e4ae45);display:grid;place-items:center;color:#fff;font-weight:800;font-size:22px}.nav{display:flex;align-items:center;gap:25px;flex:1}.nav a{color:#31373d;text-decoration:none;font-size:13px;white-space:nowrap}.nav a.active,.nav a:hover{color:var(--red)}.header-actions{display:flex;align-items:center;gap:9px;direction:ltr}.search{width:174px;height:38px;border:1px solid #ddd;border-radius:5px;display:flex;align-items:center;gap:9px;padding:0 12px;color:#999;direction:rtl}.quote{height:38px;background:var(--red);color:#fff;border:0;border-radius:4px;padding:0 18px;font-family:inherit;font-weight:700}.hero{height:210px;position:relative;overflow:hidden;background:linear-gradient(90deg,rgba(31,48,63,.96),rgba(51,80,86,.7)),linear-gradient(135deg,#5d9d9a,#dfe0bd);display:flex;align-items:center}.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 0 37%,rgba(237,202,161,.42) 38% 56%,transparent 57%),repeating-linear-gradient(90deg,transparent 0 74px,rgba(255,255,255,.15) 75px 77px);opacity:.7}.hero:after{content:"";position:absolute;inset-inline-end:8%;bottom:-35px;width:280px;height:230px;background:radial-gradient(ellipse at 50% 100%,#316946 0 22%,transparent 23%),radial-gradient(ellipse at 35% 70%,#5b9d6c 0 17%,transparent 18%),radial-gradient(ellipse at 70% 65%,#397b55 0 20%,transparent 21%);opacity:.75}.hero-inner{width:var(--container);margin:auto;padding:0 22px;position:relative;z-index:2;color:#fff}.hero h1{margin:0 0 8px;font-size:39px;font-weight:800}.hero p{margin:0;color:#eef4f0}.crumb{max-width:var(--container);margin:0 auto;padding:18px 22px 12px;color:#8a8d90;font-size:12px}.crumb a{color:#7d8388;text-decoration:none}.shop-wrap{max-width:var(--container);margin:auto;padding:0 22px 70px}.shop-head{display:flex;align-items:end;justify-content:space-between;border-bottom:1px solid var(--line);padding:0 0 14px;margin-bottom:20px}.shop-head h2{margin:0;font-size:21px}.shop-head p{margin:4px 0 0;color:var(--muted);font-size:12px}.sort{border:1px solid var(--line);border-radius:4px;padding:9px 12px;color:#666;background:#fff;font-family:inherit}.shop-layout{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:36px;direction:ltr}.catalog{direction:rtl}.sidebar{direction:rtl;border-inline-start:1px solid var(--line);padding-inline-start:22px}.sidebar h3{font-size:15px;margin:0 0 18px}.sidebar-section{padding:0 0 20px;margin-bottom:18px;border-bottom:1px solid var(--line)}.sidebar label,.sidebar a{display:block;color:#596169;text-decoration:none;font-size:12px;padding:7px 0}.sidebar input{accent-color:var(--red);margin-inline-start:8px}.swatches{display:flex;gap:8px;flex-wrap:wrap;padding-top:10px}.swatches i{width:22px;height:22px;border-radius:50%;border:1px solid #ddd}.range{height:4px;background:var(--red);margin:15px 2px;position:relative}.range:before,.range:after{content:"";position:absolute;top:50%;width:13px;height:13px;background:#fff;border:2px solid var(--red);border-radius:50%;transform:translateY(-50%)}.range:before{inset-inline-start:0}.range:after{inset-inline-end:0}.product-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}.product-card{min-width:0;position:relative}.product-photo{height:205px;background:linear-gradient(180deg,#fafafa,#f0f1ef);display:flex;align-items:end;justify-content:center;border:1px solid #eee;overflow:hidden}.can{width:112px;height:142px;border-radius:9px 9px 13px 13px;background:linear-gradient(90deg,rgba(0,0,0,.18),transparent 18% 80%,rgba(0,0,0,.13)),var(--can,#bc2d2d);box-shadow:4px 10px 13px rgba(0,0,0,.19);position:relative;margin-bottom:17px;transform:perspective(350px) rotateY(-7deg)}.can:before{content:"";position:absolute;top:-10px;left:5px;right:5px;height:17px;border-radius:50%;background:linear-gradient(#d9dde0,#8e979d);border:1px solid #7e8589;box-shadow:inset 0 3px 3px #fff8}.can:after{content:"";position:absolute;top:27px;bottom:18px;left:7px;right:7px;background:#fff;border-radius:2px;box-shadow:inset 0 0 0 1px #ddd}.can-label{position:absolute;z-index:2;top:42px;left:13px;right:13px;text-align:center;font-size:8px;line-height:1.3;font-weight:800;color:#262a2d}.can-label b{display:block;font-size:10px;margin-bottom:7px;color:var(--can,#bc2d2d)}.can-label small{display:block;color:#505960;font-size:7px;margin-top:11px}.product-card h3{font-size:13px;line-height:1.7;margin:10px 0 2px;font-weight:700}.product-meta{color:#8b9195;font-size:10px;height:18px}.price{font-size:13px;font-weight:800;color:#252b31;margin-top:5px}.price small{font-size:10px;font-weight:400}.stock{position:absolute;top:10px;inset-inline-start:10px;color:var(--green);font-size:10px}.product-card .view{display:inline-block;color:var(--red);font-size:11px;margin-top:6px;text-decoration:none}.pagination{display:flex;justify-content:center;gap:7px;margin-top:36px}.pagination span{width:30px;height:30px;border:1px solid var(--line);display:grid;place-items:center;color:#777}.pagination .current{background:var(--red);color:#fff;border-color:var(--red)}.footer{background:#272d34;color:#dce3e6;padding:30px max(22px,calc((100% - var(--container))/2));display:flex;justify-content:space-between;font-size:12px}.mobile-menu{display:none}
@media(max-width:1050px){.nav{gap:13px}.brand{min-width:170px}.search{width:130px}.product-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:760px){.topbar{justify-content:center}.topbar .social{display:none}.head-main{height:68px;padding:0 16px;gap:12px}.brand{min-width:0;flex:1;font-size:20px}.brand img{width:34px;height:34px}.nav{display:none}.mobile-menu{display:block;border:0;background:none;font-size:25px}.header-actions{gap:5px}.search{width:38px;padding:0;justify-content:center;font-size:0;border:0}.search:before{content:'⌕';font-size:23px}.quote{font-size:0;width:40px;padding:0;background:var(--navy)}.quote:after{content:'☰';font-size:18px}.hero{height:180px}.hero-inner{padding:0 22px}.hero h1{font-size:28px}.hero p{font-size:11px;max-width:220px}.hero:after{inset-inline-end:-25px;transform:scale(.7)}.crumb{padding:13px 16px}.shop-wrap{padding:0 16px 50px}.shop-head{align-items:start}.shop-head h2{font-size:18px}.sort{font-size:11px;padding:7px}.shop-layout{display:block}.sidebar{border:1px solid var(--line);padding:15px;margin-bottom:22px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.sidebar-section{border:0;margin:0;padding:0}.sidebar-section:last-child{grid-column:1/-1}.sidebar h3{grid-column:1/-1;margin-bottom:3px}.product-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px}.product-photo{height:166px}.can{transform:scale(.88) perspective(350px) rotateY(-7deg);margin-bottom:11px}.product-card h3{font-size:12px}.footer{display:block;line-height:2.2}.footer span{display:block}}
</style>
</head>
<body>
<div class="topbar"><span>ارسال سریع به سراسر ایران · مشاوره تخصصی انتخاب رنگ</span><span class="social">f&nbsp;&nbsp;◎</span></div>
<header class="site-header"><div class="head-main"><a class="brand" href="?page=home"><span class="brand-mark">ب</span><span>بامرو</span></a><nav class="nav"><a href="?page=home">خانه</a><a class="active" href="?page=shop">فروشگاه</a><a href="#">مشاوره رنگ</a><a href="#">درباره ما</a><a href="#">گالری پروژه‌ها</a><a href="#">تماس با ما</a></nav><div class="header-actions"><div class="search">جستجو <b>⌕</b></div><button class="quote">دریافت پیش‌فاکتور</button></div><button class="mobile-menu" aria-label="منو">☰</button></div></header>
<main id="app"></main>
<footer class="footer"><strong>بامرو | رنگ و پوشش حرفه‌ای</strong><span>پشتیبانی و مشاوره: ۰۲۱-۱۲۳۴۵۶۷۸</span><span>ارسال به سراسر ایران</span></footer>
<script>
const products=[['رنگ پلاستیک مات بامرو','۲۴۵٬۷۰۰','رنگ داخلی','پرفروش','#b9282e'],['ضد آب نانو بام','۶۷۵٬۲۵۰','عایق و آب‌بندی','موجود','#218ac1'],['رنگ اپوکسی کف','۸۹۰٬۷۵۰','رنگ صنعتی','موجود','#1d6cb2'],['بتونه سنگی آماده','۱۸۵٬۶۵۰','بتونه و آماده‌سازی','موجود','#d65a31'],['رنگ اکریلیک نیمه‌براق','۴۲۰٬۳۵۰','رنگ داخلی','موجود','#3d8e56'],['چسب چوب صنعتی','۱۵۶٬۲۵۰','چسب و درزگیر','موجود','#8c542e'],['رنگ ترافیک زرد','۲۹۸٬۹۰۰','رنگ صنعتی','موجود','#e1b22e'],['حلال تینر فوری','۱۹۸٬۴۵۰','حلال و ابزار','موجود','#729b9e'],['رنگ ضدزنگ فلز','۳۵۰٬۰۰۰','رنگ صنعتی','موجود','#6b5141'],['رنگ نمای ساختمان','۵۸۰٬۰۰۰','رنگ خارجی','موجود','#c8c2b1'],['سیلر چوب','۳۹۰٬۰۰۰','چوب و فلز','موجود','#875f39'],['پوشش محافظ سفید','۴۸۰٬۰۰۰','پوشش محافظ','موجود','#6b9a82']];
function can(p){return `<div class="can" style="--can:${p[4]}"><div class="can-label"><b>بامرو</b>${p[0].replace('بامرو','')}<small>۵ لیتر</small></div></div>`}
function cards(){return `<div class="product-grid">${products.map((p,i)=>`<article class="product-card"><span class="stock">● ${p[3]}</span><div class="product-photo">${can(p)}</div><h3>${p[0]}</h3><div class="product-meta">${p[2]}</div><div class="price">${p[1]} <small>تومان</small></div><a class="view" href="?page=product">مشاهده جزئیات ←</a></article>`).join('')}</div>`}
function sidebar(){return `<aside class="sidebar"><div class="sidebar-section"><h3>دسته‌بندی محصولات</h3><a href="#">رنگ ساختمانی <small>(۴)</small></a><a href="#">رنگ صنعتی <small>(۳)</small></a><a href="#">چسب و درزگیر <small>(۲)</small></a><a href="#">عایق و آب‌بندی <small>(۲)</small></a><a href="#">ابزار نقاشی <small>(۱)</small></a></div><div class="sidebar-section"><h3>فیلتر بر اساس</h3><label><input type="checkbox"> موجودی کالا</label><label><input type="checkbox"> پرفروش‌ترین‌ها</label><label><input type="checkbox"> مناسب فضای بیرونی</label></div><div class="sidebar-section"><h3>حجم بسته</h3><div class="swatches"><i style="background:#eee"></i><i style="background:#d8c4aa"></i><i style="background:#ad7a50"></i><i style="background:#526b72"></i></div><div class="range"></div><small>از ۱ تا ۲۰ لیتر</small></div></aside>`}
function shop(){return `<section class="hero"><div class="hero-inner"><h1>فروشگاه</h1><p>رنگ، چسب و پوشش تخصصی برای پروژه‌های حرفه‌ای و خانگی</p></div></section><div class="crumb"><a href="?page=home">خانه</a> / فروشگاه</div><div class="shop-wrap"><div class="shop-head"><div><h2>همه محصولات</h2><p>محصولات منتخب بامرو با ارسال سریع</p></div><select class="sort"><option>مرتب‌سازی: محبوب‌ترین</option><option>جدیدترین</option><option>ارزان‌ترین</option></select></div><div class="shop-layout"><section class="catalog">${cards()}<div class="pagination"><span>‹</span><span class="current">۱</span><span>۲</span><span>۳</span><span>›</span></div></section>${sidebar()}</div></div>`}
function home(){return `<section class="hero"><div class="hero-inner"><h1>رنگی برای هر ایده</h1><p>انتخاب مطمئن رنگ، چسب و پوشش با مشاوره تخصصی بامرو</p></div></section><div class="shop-wrap"><div class="shop-head"><div><h2>محصولات پرفروش</h2><p>انتخاب محبوب مشتریان بامرو</p></div><a class="view" href="?page=shop">مشاهده همه ←</a></div>${cards()}</div>`}
function product(){let p=products[0];return `<section class="hero"><div class="hero-inner"><h1>جزئیات محصول</h1><p>اطلاعات فنی و راهنمای انتخاب</p></div></section><div class="shop-wrap"><div class="shop-layout"><section class="catalog"><div style="display:grid;grid-template-columns:1fr 1fr;gap:30px;direction:rtl"><div class="product-photo" style="height:430px">${can(p)}</div><div><span class="stock" style="position:static">● موجود در انبار</span><h2>${p[0]}</h2><p>رنگی با پوشش یکنواخت، کم‌بو و مناسب پروژه‌های داخلی.</p><div class="price" style="font-size:22px;margin:25px 0">${p[1]} تومان</div><button class="quote" style="font-family:inherit">افزودن به سبد خرید</button></div></div></section>${sidebar()}</div></div>`}
function simple(title){return `<section class="hero"><div class="hero-inner"><h1>${title}</h1><p>تجربه خرید حرفه‌ای بامرو</p></div></section><div class="shop-wrap"><div class="shop-head"><h2>${title}</h2></div><div style="border:1px solid var(--line);padding:30px">این بخش در preview نمایشی است و در اتصال به ووکامرس با داده واقعی تکمیل می‌شود.</div></div>`}
const page=new URLSearchParams(location.search).get('page')||'shop';document.getElementById('app').innerHTML=page==='home'?home():page==='product'?product():page==='cart'?simple('سبد خرید'):page==='checkout'?simple('تسویه حساب'):shop();
</script>
</body>
</html>
