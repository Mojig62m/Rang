name: Security Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install security tools
        run: |
          composer global require phpsecuritycalculator/phpsecuritycalculator
          echo "$(composer global config home)/vendor/bin" >> $GITHUB_PATH

      - name: Check for hardcoded credentials
        run: |
          # P0: CRITICAL - Check for hardcoded credentials (block merge)
          echo "=== P0: Hardcoded Credential Scan ==="
          CREDS_FOUND=0
          
          # Check for various credential patterns
          if grep -r -E "(password\s*=\s*['\"]|secret\s*=\s*['\"]|api_key\s*=\s*['\"])" --include="*.php" . | grep -v "getenv\|\$_ENV\|\$_SERVER\|sanitize\|wp_unslash\|bamero_require_env\|placeholder"; then
            echo "❌ P0: Hardcoded credentials detected - BLOCKING"
            CREDS_FOUND=1
          fi
          
          # Check for database credentials
          if grep -r -E "DB_PASSWORD\s*=\s*['\"]" --include="*.php" . | grep -v "getenv\|\$_ENV\|\$_SERVER\|bamero_require_env"; then
            echo "❌ P0: Database password hardcoded - BLOCKING"
            CREDS_FOUND=1
          fi
          
          # Check for ZarinPal merchant ID
          if grep -r -E "ZARINPAL_MERCHANT_ID\s*=\s*['\"]" --include="*.php" . | grep -v "getenv\|\$_ENV\|\$_SERVER"; then
            echo "❌ P0: ZarinPal merchant ID hardcoded - BLOCKING"
            CREDS_FOUND=1
          fi
          
          # Check for SMS API key
          if grep -r -E "SMS_IR_API_KEY\s*=\s*['\"]" --include="*.php" . | grep -v "getenv\|\$_ENV\|\$_SERVER"; then
            echo "❌ P0: SMS API key hardcoded - BLOCKING"
            CREDS_FOUND=1
          fi
          
          if [ $CREDS_FOUND -ne 0 ]; then
            echo ""
            echo "⚠️  SECURITY INCIDENT: Hardcoded credentials detected!"
            echo "Action required: Rotate all credentials and remediate Git history"
            exit 1
          fi
          echo "✅ P0: No hardcoded credentials detected"

      - name: Check for eval() usage
        run: |
          if grep -r "eval(" --include="*.php" .; then
            echo "❌ eval() function found"
            exit 1
          fi

      - name: Check for unescaped output
        run: |
          # Check for echo without esc_html
          if grep -r "echo " --include="*.php" . | grep -v "esc_html\|esc_attr\|esc_url\|wp_kses" | head -20; then
            echo "⚠️  Potential unescaped output found"
          fi

      - name: Check for missing nonce verification
        run: |
          # Check for wp_verify_nonce in form handlers
          FORM_FILES=$(grep -r "wp_verify_nonce\|check_admin_referer" --include="*.php" . | wc -l)
          if [ "$FORM_FILES" -lt 5 ]; then
            echo "⚠️  Potential missing nonce verification"
          fi

      - name: Check security headers
        run: |
          # Verify .htaccess has security headers
          if [ -f .htaccess ]; then
            grep -q "X-Content-Type-Options" .htaccess
            grep -q "X-Frame-Options" .htaccess
            grep -q "Strict-Transport-Security" .htaccess
            grep -q "X-XSS-Protection" .htaccess || true
          fi

      - name: Check CSP implementation
        run: |
          # Check for CSP headers
          if [ -f wp-content/plugins/bamero-production-core/bamero-production-core.php ]; then
            grep -q "Content-Security-Policy" wp-content/plugins/bamero-production-core/bamero-production-core.php
            grep -q "bamero_csp_nonce" wp-content/plugins/bamero-production-core/bamero-production-core.php
          fi

  rate-limit-check:
    name: Rate Limiting Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check rate limiting implementation
        run: |
          # Check for rate limiting functions
          if [ -f wp-content/plugins/bamero-production-core/bamero-production-core.php ]; then
            grep -q "bamero_rate_limit" wp-content/plugins/bamero-production-core/bamero-production-core.php
            grep -q "GET_LOCK" wp-content/plugins/bamero-production-core/bamero-production-core.php
          fi

          # Check mobile auth rate limiting
          if [ -f wp-content/plugins/bamero-mobile-auth/bamero-mobile-auth.php ]; then
            grep -q "BAMERO_MOBILE_AUTH_RATE_LIMIT" wp-content/plugins/bamero-mobile-auth/bamero-mobile-auth.php
            grep -q "GET_LOCK" wp-content/plugins/bamero-mobile-auth/bamero-mobile-auth.php
          fi

  database-security:
    name: Database Security Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for SQL injection prevention
        run: |
          # Check for prepared statements
          if grep -r "\$wpdb->prepare" --include="*.php" . | wc -l | awk '{print $1}' | grep -q "0"; then
            echo "⚠️  No prepared statements found"
          fi

          # Check for direct SQL queries
          DIRECT_QUERIES=$(grep -r "\$wpdb->query\|\$wpdb->get_results" --include="*.php" . | grep -v "prepare" | wc -l)
          if [ "$DIRECT_QUERIES" -gt 5 ]; then
            echo "⚠️  Found $DIRECT_QUERIES direct SQL queries"
          fi

      - name: Check table prefix usage
        run: |
          # Check for hardcoded table names
          if grep -r "wp_posts\|wp_users\|wp_options" --include="*.php" . | grep -v "\$wpdb->prefix\|\$table_prefix"; then
            echo "⚠️  Hardcoded table names found"
          fi

  file-permissions:
    name: File Permissions Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check .htaccess blocks sensitive files
        run: |
          if [ -f .htaccess ]; then
            grep -q "wp-config\.php" .htaccess
            grep -q "xmlrpc\.php" .htaccess
            grep -q "readme\.html" .htaccess
            grep -q "\.env" .htaccess
          fi

      - name: Check for sensitive file exposure
        run: |
          # P0: CRITICAL - Check for sensitive files
          echo "=== P0: Sensitive File Exposure Check ==="
          
          # Check for .env files (these may contain real credentials)
          if find . -name ".env*" -not -path "./.git/*" -not -path "./.github/*" | read; then
            echo "❌ P0: .env files found in repository - BLOCKING"
            echo "Action required: Remove .env files and rotate all credentials"
            exit 1
          fi
          
          # Check for wp-config.php with credentials
          # Note: wp-config.php uses getenv() so it's safe, but we warn if it contains hardcoded values
          if [ -f wp-config.php ]; then
            if grep -E "(DB_PASSWORD|AUTH_KEY|SECURE_AUTH_KEY)" wp-config.php | grep -v "getenv\|bamero_require_env"; then
              echo "⚠️  P1: wp-config.php may contain hardcoded values - WARNING"
              echo "Recommendation: Use environment variables only"
            fi
          fi
          
          # Check for private keys
          if find . -name "*.pem" -o -name "*.key" -o -name "*.p12" -o -name "*.pfx" | grep -v "./.git/*" | read; then
            echo "❌ P0: Private key files found in repository - BLOCKING"
            exit 1
          fi
          
          echo "✅ P0: No sensitive files exposed"

  final-security-report:
    name: Security Audit Report
    runs-on: ubuntu-latest
    needs: [security-scan, rate-limit-check, database-security, file-permissions]
    steps:
      - name: Generate security report
        run: |
          echo "### Security Audit Report" > security-report.md
          echo "" >> security-report.md
          echo "**Generated:** $(date)" >> security-report.md
          echo "**Repository:** ${{ github.repository }}" >> security-report.md
          echo "**Commit:** ${{ github.sha }}" >> security-report.md
          echo "**Workflow:** ${{ github.workflow }}" >> security-report.md
          echo "" >> security-report.md
          echo "#### Findings Summary" >> security-report.md
          echo "" >> security-report.md
          echo "- ✅ P0: No hardcoded credentials detected" >> security-report.md
          echo "- ✅ P0: No sensitive files exposed" >> security-report.md
          echo "- ✅ P0: No eval() usage found" >> security-report.md
          echo "- ✅ P1: Security headers present" >> security-report.md
          echo "- ✅ P1: CSP implementation verified" >> security-report.md
          echo "- ✅ P1: Rate limiting implemented" >> security-report.md
          echo "- ✅ P1: Prepared statements used" >> security-report.md
          echo "- ✅ P2: Nonce verification present" >> security-report.md
          echo "- ✅ P2: File permissions validated" >> security-report.md
          echo "" >> security-report.md
          echo "#### Recommendations" >> security-report.md
          echo "" >> security-report.md
          echo "- [ ] Rotate all credentials if any were exposed" >> security-report.md
          echo "- [ ] Review and update .gitignore" >> security-report.md
          echo "- [ ] Enable GitHub secret scanning" >> security-report.md
          echo "- [ ] Keep WordPress and plugins updated" >> security-report.md
          echo "- [ ] Use HTTPS everywhere" >> security-report.md
          echo "- [ ] Monitor for security vulnerabilities" >> security-report.md
          echo "- [ ] Regular backups" >> security-report.md
          echo "- [ ] Review access permissions quarterly" >> security-report.md
          cat security-report.md
