name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  php-syntax:
    name: PHP Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Check PHP syntax
        run: |
          find . -type f -name "*.php" -not -path "./.git/*" | while read file; do
            php -l "$file" || exit 1
          done

  php-lint:
    name: PHP Lint & Code Style
    runs-on: ubuntu-latest
    needs: php-syntax
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.2'

      - name: Install PHP_CodeSniffer
        run: |
          composer global require squizlabs/php_codesniffer
          echo "$(composer global config home)/vendor/bin" >> $GITHUB_PATH

      - name: Check code style
        run: |
          phpcs --standard=phpcs.xml.dist --extensions=php --encoding=utf-8 -n .
          if [ $? -ne 0 ]; then
            echo "❌ Code style violations found. Please fix before merging."
            exit 1
          fi

  security-check:
    name: Security Headers & CSP
    runs-on: ubuntu-latest
    needs: php-syntax
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check security headers in .htaccess
        run: |
          if [ -f .htaccess ]; then
            grep -q "X-Content-Type-Options" .htaccess || { echo "Missing X-Content-Type-Options header"; exit 1; }
            grep -q "X-Frame-Options" .htaccess || { echo "Missing X-Frame-Options header"; exit 1; }
            grep -q "Strict-Transport-Security" .htaccess || { echo "Missing HSTS header"; exit 1; }
          fi

      - name: Check CSP in production-core
        run: |
          if [ -f wp-content/plugins/bamero-production-core/bamero-production-core.php ]; then
            grep -q "Content-Security-Policy" wp-content/plugins/bamero-production-core/bamero-production-core.php || { echo "Missing CSP header"; exit 1; }
          fi

  woocommerce-check:
    name: WooCommerce Compatibility
    runs-on: ubuntu-latest
    needs: php-syntax
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.2'

      - name: Check WooCommerce functions
        run: |
          # EXECUTABLE TEST: Verify HPOS compatibility declarations
          echo "=== WooCommerce HPOS Compatibility Test ==="
          HPOS_CHECKS=0
          TOTAL_CHECKS=3
          
          # Check bamero-production-core
          if grep -q "custom_order_tables" wp-content/plugins/bamero-production-core/bamero-production-core.php; then
            echo "✅ bamero-production-core: HPOS compatible"
            HPOS_CHECKS=$((HPOS_CHECKS + 1))
          else
            echo "❌ bamero-production-core: HPOS compatibility not declared"
          fi
          
          # Check bamero-mobile-auth
          if grep -q "custom_order_tables" wp-content/plugins/bamero-mobile-auth/bamero-mobile-auth.php; then
            echo "✅ bamero-mobile-auth: HPOS compatible"
            HPOS_CHECKS=$((HPOS_CHECKS + 1))
          else
            echo "❌ bamero-mobile-auth: HPOS compatibility not declared"
          fi
          
          # Check bamero-zarinpal-gateway
          if grep -q "custom_order_tables" wp-content/plugins/bamero-zarinpal-gateway/bamero-zarinpal-gateway.php; then
            echo "✅ bamero-zarinpal-gateway: HPOS compatible"
            HPOS_CHECKS=$((HPOS_CHECKS + 1))
          else
            echo "❌ bamero-zarinpal-gateway: HPOS compatibility not declared"
          fi
          
          # Check for WooCommerce gateway class
          if grep -q "WC_Payment_Gateway" wp-content/plugins/bamero-zarinpal-gateway/bamero-zarinpal-gateway.php; then
            echo "✅ ZarinPal gateway extends WC_Payment_Gateway"
          else
            echo "❌ Missing WooCommerce gateway class"
            exit 1
          fi
          
          echo ""
          echo "HPOS Compatibility: $HPOS_CHECKS/$TOTAL_CHECKS plugins"
          if [ $HPOS_CHECKS -lt $TOTAL_CHECKS ]; then
            echo "⚠️  Not all plugins declare HPOS compatibility"
            exit 1
          fi

  validation:
    name: File Structure Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          # Check for essential files
          [ -f wp-config.php ] || { echo "Missing wp-config.php"; exit 1; }
          [ -f .htaccess ] || { echo "Missing .htaccess"; exit 1; }
          grep -q "add_filter('robots_txt'" wp-content/themes/bamero/inc/seo.php || { echo "Missing dynamic robots.txt filter"; exit 1; }
          [ -f wp-content/plugins/bamero-production-core/bamero-production-core.php ] || { echo "Missing production core"; exit 1; }
          [ -f wp-content/plugins/bamero-mobile-auth/bamero-mobile-auth.php ] || { echo "Missing mobile auth"; exit 1; }
          [ -f wp-content/plugins/bamero-zarinpal-gateway/bamero-zarinpal-gateway.php ] || { echo "Missing zarinpal gateway"; exit 1; }

      - name: Check no mock data
        run: |
          # Project documentation lives in the repo root and is blocked by .htaccess
          # and excluded from deploys; only flag mock/test files and nested markdown.
          FOUND=$(find . -type f \( -name "*mock*" -o -name "*test*" -o -path "./wp-content/*.md" \) -not -path "./.git/*" -not -path "./.github/*")
          if [ -n "$FOUND" ]; then
            echo "Found non-production files:"
            echo "$FOUND"
            exit 1
          fi

      - name: Check no docker files
        run: |
          if [ -d docker ] || [ -f docker-compose.yml ]; then
            echo "Found docker files"
            exit 1
          fi

  final-check:
    name: Final Production Readiness
    runs-on: ubuntu-latest
    needs: [php-syntax, php-lint, security-check, woocommerce-check, validation]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify no secrets in repository
        run: |
          # Flag secret-looking keys assigned a quoted literal of 6+ chars
          # (password = 'hunter2!', 'api_key' => "abc123..."). Reading the value
          # from getenv()/a variable is the supported pattern and is not matched.
          PATTERN="(password|secret|api_key|merchant_id|DB_PASSWORD)['\"]?[[:space:]]*(=|=>)[[:space:]]*['\"][^'\"]{6,}['\"]"
          if grep -r -n -i -E "$PATTERN" --include="*.php" --include="*.txt" --include="*.json" --exclude-dir=.git . ; then
            echo "❌ Potential hardcoded secret found"
            exit 1
          fi
          echo "✅ No hardcoded secrets detected"

      - name: Production ready
        run: echo "✅ All checks passed - Production ready"
